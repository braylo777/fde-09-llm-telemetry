[package]
name = "fde-09-llm-telemetry"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenTelemetry spans for LLM calls, cost per department, time-saved ROI, silent-failure alerts and usage billing."
repository = "https://github.com/braylo777/fde-09-llm-telemetry"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fde-09-llm-telemetry"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hmac = "=0.12.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
